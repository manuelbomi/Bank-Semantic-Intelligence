services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only}
      POSTGRES_DB: bank
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./sql/schema.sql:/docker-entrypoint-initdb.d/001.sql:ro"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${BANK_NEO4J_PASSWORD:-local-demo-password}
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: ["graphdata:/data"]
volumes:
  pgdata:
  graphdata:
